common:
  save_interval: 1
  val_interval: 5
  log_interval: 100
  max_epoch: 200
  seed: 3401
  amp: False

datasets:
  # Eigenscape dataset configuration
  eigenscape_base_path: '/scratch/eigenscape'
  eigenscape_train_folders: [Beach, 'Busy Street', Park, 'Pedestrian Zone', 'Quiet Street', 'Shopping Centre']
  eigenscape_valid_folders: ['Train Station', Woodland]
  num_channels_to_load: 2  # Number of random channels to load from each 32-channel file
  
  batch_size: 8
  tensor_cut: 24000  # 1 second at 24kHz
  num_workers: 4
  fixed_length: 10000  # 10k samples per epoch (10000 / 8 batch_size = 1250 batches per epoch)
  pin_memory: False  # Disable to save memory

checkpoint:
  resume: True
  checkpoint_path: '/user/i/iran/encodec-pytorch/outputs/2025-10-21/23-31-14/checkpoints_multi_dataset/bs16_cut24000_length32000_epoch300_lr0.0003.pt'
  disc_checkpoint_path: '/user/i/iran/encodec-pytorch/outputs/2025-10-21/23-31-14/checkpoints_multi_dataset/bs16_cut24000_length32000_epoch300_disc_lr0.0003.pt'
  save_folder: './checkpoints_eigenscape_consistency_0/'
  save_location: '${checkpoint.save_folder}/bs${datasets.batch_size}_cut${datasets.tensor_cut}_length${datasets.fixed_length}_' 

optimization:
  lr: 3e-4
  disc_lr: 3e-4

lr_scheduler:
  warmup_epoch: 5

model:
  target_bandwidths: [1.5, 3., 6., 12., 24.]
  sample_rate: 24_000
  channels: 2
  train_discriminator: True
  audio_normalize: True
  filters: 32
  ratios: [8, 5, 4, 2]
  disc_win_lengths: [2048, 1024, 512, 256, 128]
  disc_hop_lengths: [512, 256, 128, 64, 32]
  disc_n_ffts: [2048, 1024, 512, 256, 128]
  causal: True
  norm: 'weight_norm'
  segment: None
  name: 'eigenscape_encodec_consistency_0'
  
  # Slice consistency configuration (intra-channel)
  slice_consistency:
    slice_interval_type: random  # "random", "static", or "static_duration"
    split_interval_percentage: 0.2  # 20% of audio length for random slices
    feature_types: ["quant_in"]  # Features to compare: ["quant_in", "quant_out", "sub_quants"]
    loss_types: ["mse_loss"]  # Loss types: ["mse_loss"]
    augmentation_constraint_loss_weight: 1.0  
    slice_consistency_constraint_loss_weight: 1.0  
    target_sr: 24000
    ds_rate: 320  # Downsampling rate (encoder hop length)
    mse_loss_reduction: mean  # "mean" or "sum"
  
  # Perturbation encoder configuration (for data augmentation consistency)
  perturb_encoder:
    perturb_methods: ["volume_aug", "inversion_aug"]  # Augmentation methods to apply
    volume_aug_config:
      gain_range: [0.5, 2.0]  # (min_gain, max_gain) - gain multiplier range
      apply_prob: 0.5  # Probability of applying volume augmentation
    inversion_aug_config:
      apply_prob: 0.5  # Probability of applying audio inversion
    perturb_all_audio: true  # Apply perturbations to full audio
    perturb_slice_audio: true  # Apply perturbations to slice audio

  # Inter-channel consistency configuration
  inter_channel_consistency:
    enabled: True
    codebook_index: 0  # Only compare codebook 0 between channels
    loss_type: mse_loss  # "mse_loss"
    loss_weight: 1.0  # Weight for inter-channel consistency loss
    mse_loss_reduction: mean  # "mean" or "sum"

distributed:
  data_parallel: True
  world_size: 1
  find_unused_parameters: False
  torch_distributed_debug: False
  init_method: tcp

balancer:
  weights:
    l_t: 0.1
    l_f: 1
    l_g: 3
    l_feat: 3

# Weights & Biases configuration
wandb:
  enabled: True
  project: 'eigenscape-encodec-consistency-0'
  name: 'eigenscape_consistency_0_bs8_epochs200_24khz'
  upload_artifacts: False   
