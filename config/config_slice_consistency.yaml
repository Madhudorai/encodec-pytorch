common:
  save_interval: 1
  val_interval: 5
  log_interval: 100
  max_epoch: 400
  seed: 3401
  amp: False

datasets:
  # Multi-dataset configuration
  jamendo_train_csv: '/scratch/iran/jamendo/jamendo_train.csv'
  jamendo_valid_csv: '/scratch/iran/jamendo/jamendo_val.csv'
  jamendo_test_csv: '/scratch/iran/jamendo/jamendo_test.csv'
  
  common_voice_train_csv: '/scratch/iran/common_voice/common_voice_train.csv'
  common_voice_valid_csv: '/scratch/iran/common_voice/common_voice_val.csv'
  common_voice_test_csv: '/scratch/iran/common_voice/common_voice_test.csv'
  
  fsd50k_train_csv: '/scratch/iran/fsd50k/fsd50k_train.csv'
  fsd50k_valid_csv: '/scratch/iran/fsd50k/fsd50k_val.csv'
  fsd50k_test_csv: '/scratch/iran/fsd50k/fsd50k_test.csv'
  
  dns_challenge4_train_csv: '/scratch/iran/dns_challenge4/dns_challenge4_train.csv'
  dns_challenge4_valid_csv: '/scratch/iran/dns_challenge4/dns_challenge4_val.csv'
  dns_challenge4_test_csv: '/scratch/iran/dns_challenge4/dns_challenge4_test.csv'
  
  batch_size: 16
  tensor_cut: 24000  # 1 second at 24kHz
  num_workers: 4
  fixed_length: 32000  # 2k updates per epoch (2000 * 16 batch_size)
  pin_memory: False  # Disable to save memory

checkpoint:
  resume: True
  checkpoint_path: '/user/i/iran/encodec-pytorch/outputs/2025-10-21/23-31-14/checkpoints_multi_dataset/bs16_cut24000_length32000_epoch300_lr0.0003.pt'
  disc_checkpoint_path: '/user/i/iran/encodec-pytorch/outputs/2025-10-21/23-31-14/checkpoints_multi_dataset/bs16_cut24000_length32000_epoch300_disc_lr0.0003.pt'
  save_folder: './checkpoints_multi_dataset_slice_consistency/'
  save_location: '${checkpoint.save_folder}/bs${datasets.batch_size}_cut${datasets.tensor_cut}_length${datasets.fixed_length}_' 

optimization:
  lr: 3e-4
  disc_lr: 3e-4

lr_scheduler:
  warmup_epoch: 5

model:
  target_bandwidths: [1.5, 3., 6., 12., 24.]
  sample_rate: 24_000
  channels: 1
  train_discriminator: True
  audio_normalize: True
  filters: 32
  ratios: [8, 5, 4, 2]
  disc_win_lengths: [2048, 1024, 512, 256, 128]
  disc_hop_lengths: [512, 256, 128, 64, 32]
  disc_n_ffts: [2048, 1024, 512, 256, 128]
  causal: True
  norm: 'weight_norm'
  segment: None
  name: 'multi_dataset_encodec_slice_consistency'
  
  # Slice consistency configuration
  slice_consistency:
    slice_interval_type: random  # "random", "static", or "static_duration"
    split_interval_percentage: 0.2  # 20% of audio length for random slices
    feature_types: ["quant_in"]  # Features to compare: ["quant_in", "quant_out", "sub_quants"]
    loss_types: ["mse_loss"]  # Loss types: ["mse_loss"]
    loss_weights: [20.0]  # Weight for slice consistency loss
    target_sr: 24000
    ds_rate: 320  # Downsampling rate (encoder hop length)
    mse_loss_reduction: mean  # "mean" or "sum"
  
  # Perturbation encoder configuration (for data augmentation consistency)
  perturb_encoder:
    perturb_methods: ["volume_aug", "inversion_aug"]  # Augmentation methods to apply
    volume_aug_config:
      gain_range: [0.5, 2.0]  # (min_gain, max_gain) - gain multiplier range
      apply_prob: 0.5  # Probability of applying volume augmentation
    inversion_aug_config:
      apply_prob: 0.5  # Probability of applying audio inversion
    perturb_all_audio: true  # Apply perturbations to full audio
    perturb_slice_audio: true  # Apply perturbations to slice audio

distributed:
  data_parallel: True
  world_size: 1
  find_unused_parameters: False
  torch_distributed_debug: False
  init_method: tcp

balancer:
  weights:
    l_t: 0.1
    l_f: 1
    l_g: 3
    l_feat: 3

# Weights & Biases configuration
wandb:
  enabled: True
  project: 'multi-dataset-encodec-slice-consistency'
  name: 'multi_dataset_slice_consistency_bs16_epochs400_24khz_mono'
